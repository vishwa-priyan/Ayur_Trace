services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ayur_trace}
      POSTGRES_USER: ${POSTGRES_USER:-ayurtrace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ayurtrace}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    environment:
      NODE_ENV: production
      PORT: 5000
      HOST: 0.0.0.0
      DATABASE_URL: postgres://${POSTGRES_USER:-ayurtrace}:${POSTGRES_PASSWORD:-ayurtrace}@db:5432/${POSTGRES_DB:-ayur_trace}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your environment or .env file}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      SERVE_FRONTEND: "true"
    ports:
      - "${APP_PORT:-5000}:5000"
    volumes:
      - uploads_data:/app/backend/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  uploads_data:
